name: TypeScript v7 Compatibility

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  typescript-v7:
    name: Build and Test TS RC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24.16.0'

      - name: Install Dependencies
        run: npm ci

      - name: Switch TypeScript to RC
        run: |
          npm i --no-save --force typescript@rc
          node -p "require('./node_modules/typescript/package.json').version"

      - name: Save error log
        uses: actions/upload-artifact@v7.0.1
        if: ${{ failure() }}
        with:
          name: npm-debug-log-ts7-${{ hashFiles('package-lock.json') }}
          path: npm-debug.log

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

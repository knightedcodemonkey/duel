name: TypeScript Next (Advisory)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ts-next:
    name: TS next (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
      - name: Install Dependencies
        run: npm ci
      - name: Switch TypeScript to next
        run: npm i --no-save --force typescript@next
      - name: Show TypeScript Version
        run: node -p "require('typescript/package.json').version"
      - name: Save error log
        uses: actions/upload-artifact@v7.0.1
        if: ${{ failure() }}
        with:
          name: npm-debug-log-ts-next-${{ hashFiles('package-lock.json') }}
          path: npm-debug.log
      - name: Pack
        run: npm pack
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
